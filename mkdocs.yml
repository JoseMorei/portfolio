site_name: Jose Moreira
site_description: >-
  Senior Site Reliability Engineer and AI Solutions Architect - production-grade
  AI systems, cloud infrastructure, Kubernetes, IaC and security compliance.
site_author: Jose Moreira
# TODO: change to your custom domain once DNS is pointed (see README.md).
site_url: https://JoseMorei.github.io/portfolio/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/console-network
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/josemoreira2
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/JoseMorei
      name: GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/jgmoreira
      name: Hugging Face
    - icon: simple/kaggle
      link: https://www.kaggle.com/josemoreirauy
      name: Kaggle
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

